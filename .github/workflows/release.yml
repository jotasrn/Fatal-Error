# Publica uma versao nova do Fatal Error e dispara o auto-update para todos os jogadores (modelo Concord).
#
# Dispara ao empurrar uma tag v* (ex.: git tag v1.3.0 && git push origin v1.3.0)
# ou manualmente pela aba Actions (workflow_dispatch).
#
# O electron-builder aplica os Electron Fuses de seguranca no executavel, gera o
# instalador NSIS + .blockmap + versao Portatil (.zip) + latest.yml e publica no
# GitHub Releases usando o proprio GITHUB_TOKEN automatico do repositorio.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe e integridade do CSP
        run: npm run check

      - name: Testes de seguranca e protocolo P2P
        run: npm test

      - name: Auditoria de seguranca das dependencias
        run: npm audit --audit-level=high

      - name: Sincronizar versao do pacote com a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          npm version "$VERSAO" --no-git-tag-version --allow-same-version

      - name: Empacotar, aplicar Fuses e publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          npx electron-builder --win nsis zip
          --config.directories.output=release --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Links fixos que nunca mudam (.../releases/latest/download/Fatal-Error-Setup.exe)
      # + hashes SHA-256 de integridade + notas automaticas do release.
      - name: Links fixos de download, SHA256SUMS e notas do release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSAO="${TAG#v}"
          cp "Fatal-Error-Setup-${VERSAO}.exe" Fatal-Error-Setup.exe
          cp "Fatal-Error-Portable-${VERSAO}.zip" Fatal-Error-Portable.zip
          sha256sum Fatal-Error-Setup.exe Fatal-Error-Portable.zip \
            "Fatal-Error-Setup-${VERSAO}.exe" "Fatal-Error-Portable-${VERSAO}.zip" > SHA256SUMS.txt
          gh release upload "$TAG" Fatal-Error-Setup.exe Fatal-Error-Portable.zip SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## Baixar Fatal Error ${TAG}"
            echo
            echo "| Formato | Descricao |"
            echo "| --- | --- |"
            echo "| **[Instalador Windows (recomendado)](${BASE}/Fatal-Error-Setup.exe)** | Instala, cria atalho e **atualiza o jogo sozinho** sempre que sair versao nova |"
            echo "| [Versao Portatil (.zip)](${BASE}/Fatal-Error-Portable.zip) | Descompacte e execute \`Fatal Error.exe\`, sem instalar |"
            echo "| [SHA256SUMS.txt](${BASE}/SHA256SUMS.txt) | Hashes SHA-256 para conferencia de integridade dos binarios |"
            echo
            echo "Windows 10/11 (64 bits). Na primeira instalacao o Windows SmartScreen pode avisar por nao haver certificado EV pago: clique em **Mais informacoes > Executar assim mesmo**."
            echo
            echo "> **Quem ja tem o Fatal Error instalado nao precisa baixar nada:** o jogo detecta e baixa esta versao em segundo plano sem interromper partidas em andamento."
            echo
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > notas.md
          gh release edit "$TAG" --notes-file notas.md --repo "$GITHUB_REPOSITORY"

      - name: Empacotar build de teste sem publicar (workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: >
          npx electron-builder --win nsis zip
          --config.directories.output=release --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: fatal-error-windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: warn

