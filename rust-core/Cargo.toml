[package]
name = "fatal-error-wasm-core"
version = "1.4.0"
edition = "2021"
description = "Rust + WebAssembly Physics, Spatial Hash, Raycast & A* Pathfinding Kernel for Fatal Error"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

